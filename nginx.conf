# 门户相关 nginx 片段（存档参考）
#
# ⚠️ 部署件是完整 server 块，见仓库根 nginx-single80-subpath.conf；
# 本文件只摘录门户部分，说明「裸 / 只归门户、文件名必须是 portal.html」的原理。
#
# 要点：
#   1) location = / 精确匹配只吃「裸根路径」，karuta 的其余路径不受影响；
#   2) 门户文件名必须避开 /index.html —— karuta 的 SPA 回退（try_files ... /index.html）
#      会解析该 URI，若被门户占用，karuta 所有前端路由都会渲染门户页；
#   3) try_files /portal.html =404 在当前 context 命中即服务，不做二次 URI 匹配。

location = / {
    root /opt/aryuu-portal;
    try_files /portal.html =404;
    add_header Cache-Control "no-cache" always;
}

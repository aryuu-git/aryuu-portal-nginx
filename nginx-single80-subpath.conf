# 部署件（唯一）：纯 IP 单端口（80）三站合一 server 块 —— 门户占根 / anitexas 子路径 / karuta 兜底。
# 部署：用它**替换服务器上整个 server {}**（如 /etc/nginx/conf.d/aryuu.conf），再 `nginx -t && systemctl reload nginx`。
# 基线对照：线上快照 backups/aryuu-nginx-catchall-2026-10-05.conf（逐条等价；/ws/ 除外，见 v3）。
# 配套：anitexas 前端为子路径化（vite base=/anitexas/，构建产物 data/dist）。
#
# v2 修订（吸收评审意见）：
#   1) /karuta 301 与线上逐字保真（/astrbot 跳转按 Owner 决定删除）；
#   2) anitexas 静态弃用 try_files（规避 alias+try_files 前缀拼接 quirk），SPA 兜底走 error_page；
#   3) /anitexas/ws 由精确匹配放宽为前缀匹配（兼容尾斜杠）；
#   4) 哈希资源 /anitexas/assets/ 长缓存、/anitexas/fonts/ 30d（不再被 no-cache 连坐）。
#
# v3 修订（2026-10-05，修复 karuta 对局 WS 握手 403）：
#   1) /ws/ 补 proxy_set_header Host $host —— 缺省时 nginx 把 Host 落成 $proxy_host
#      （127.0.0.1:8080），karuta 后端 security.OriginAllowed 的「Origin 与 Host 同源」
#      比对必失败，gorilla CheckOrigin 于升级阶段 403（线上连 5 次握手 403 实测）。
#      对照 karuta/deploy/nginx.conf 的 /ws/ 本就有此项，属搬运抄丢的回归；
#   2) Upgrade 改 $http_upgrade、Connection 值加引号，与 karuta deploy 件写法一致。
#
# 路径分配：
#   = /              → 门户（/opt/aryuu-portal/portal.html，避开 karuta SPA 回退的 /index.html）
#   /karuta          → 线上既有 301 跳转（保真；/astrbot 跳转已按 Owner 决定删除）
#   /anitexas/ws     → 8081 WS（proxy_pass 带 /ws 剥前缀）
#   /anitexas/api/   → 8081 REST（尾斜杠剥前缀）
#   /anitexas/       → anitexas 前端 dist（SPA 兜底 error_page）
#   其余全部         → karuta（dist 根 + /api/ /ws/ /uploads/ 反代 8080）
#
# 注意：add_header 为「整层覆盖」——本配置各 location 内出现 add_header 即顶掉 server 级继承；
#      将来若在 server 级统一加安全头，需在每个写 add_header 的 location 里重复补齐。

server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    # ===== 门户：只占「裸 /」 =====
    location = / {
        root /opt/aryuu-portal;
        try_files /portal.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # ===== 线上既有跳转（基线保真） =====
    # /karuta 原是 karuta 首页别名；门户占根后 301 目标（/）= 门户页。保持与线上逐字一致。
    location /karuta {
        return 301 /;
    }

    # ===== anitexas：/anitexas/ 子路径 =====
    location = /anitexas {
        return 302 /anitexas/;
    }

    location /anitexas/ws {
        # 前缀匹配（兼容 /anitexas/ws 与 /anitexas/ws/）；proxy_pass 带 URI /ws 剥前缀。
        proxy_pass http://127.0.0.1:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /anitexas/api/ {
        # 尾斜杠 proxy_pass：/anitexas/api/rooms → 后端 /api/rooms
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 哈希资源：文件名即版本，长缓存 immutable（静态 alias 服务，无 try_files）
    location /anitexas/assets/ {
        alias /opt/anitexas/current/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # 子集字体：中期缓存（更新须改文件名）
    location /anitexas/fonts/ {
        alias /opt/anitexas/current/dist/fonts/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # 前端壳 + SPA 兜底：刻意不用 try_files（规避 alias+try_files 前缀拼接 quirk）。
    # 已存在文件由静态模块经 alias 正常服务；未命中（客户端路由）404 内部转 index.html。
    location /anitexas/ {
        alias /opt/anitexas/current/dist/;
        index index.html;
        error_page 404 = /anitexas/index.html;
        add_header Cache-Control "no-cache" always;
    }
    location = /anitexas/index.html {
        alias /opt/anitexas/current/dist/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ===== karuta：其余全部，与线上一致（/ws/ 为 v3 修复，其余逐字） =====
    location / {
        root /opt/karuta/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 必传（v3）：后端 OriginAllowed 比对 Origin 与 Host；不传则 Host=127.0.0.1:8080，
        # 握手被 CheckOrigin 403 拒绝。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
    }
}

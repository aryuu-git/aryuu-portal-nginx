# 备份存档（勿部署）：aryuu 服务器 nginx 兜底 server 块线上配置快照。
# 记录时间：2026-10-05；来源：Owner 提供的当时生效配置，原样保存。
# 布局：server_name _ 兜底 = karuta（/opt/karuta/frontend/dist），/api/ /ws/ /uploads/ 反代 8080，
#       /karuta 301 回 /，/astrbot 301 跳 :6185。
# 门户（/portal/）location 片段见 ../nginx.conf，追加进本块后此备份更新时一并记。

server {
    listen 80;
    server_name _;
    client_max_body_size 30M;

    # ===== 歌牌 =====
    location / {
        root /opt/karuta/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    location /karuta {
        return 301 /;
    }

    location /astrbot {
        return 301 http://$host:6185;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade websocket;
        proxy_set_header Connection upgrade;
        proxy_read_timeout 86400;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
    }

}
